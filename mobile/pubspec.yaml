name: raaga_kannada_music
description: "Raaga - Exclusive Kannada Music Streaming & Offline Listening App for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Audio Playback, Background Controls, CarPlay / Android Auto
  just_audio: ^0.9.39
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # Local Offline Database & Encrypted Storage
  sqflite: ^2.3.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking, Connectivity & Caching
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1

  # Voice Search & Permissions
  speech_to_text: ^6.6.2

  # Firebase Auth, Sync, Analytics & Crashlytics
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  google_sign_in: ^6.2.1
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.0.2

  # UI Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
